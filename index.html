<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bus Pass Verification</title>
  <style>
    body {
      background-color: #0d232a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      width: 380px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }
    .header {
      background-color: #007a78;
      color: white;
      padding: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .profile-img {
      width: 100px;
      height: 110px;
      margin-top: 15px;
      border-radius: 4px;
      object-fit: cover;
    }
    .info-box {
      background: #f4f8f8;
      margin: 8px 15px;
      padding: 8px;
      border-radius: 6px;
      text-align: left;
    }
    .label {
      font-size: 10px;
      color: #007a78;
      font-weight: bold;
      text-transform: uppercase;
    }
    .value {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">VALID BUS PASS</div>
    <img src="student.jpg" class="profile-img" alt="Student Photo">
    
    <h2>BISMA KAINAT</h2>
    <p style="font-size:11px; color:gray;">CIIT/FA24-BRG-002/ISB</p>

    <div class="info-box">
      <div class="label">Father Name</div>
      <div class="value">MUHAMMAD SHAKEEL</div>
    </div>

    <div class="info-box">
      <div class="label">Program</div>
      <div class="value">BRG</div>
    </div>

    <div class="info-box">
      <div class="label">Route</div>
      <div class="value">Route 07</div>
    </div>

    <div class="info-box">
      <div class="label">Valid Until</div>
      <div class="value">25 Jan 2027</div>
    </div>
  </div>

</body>
</html>
